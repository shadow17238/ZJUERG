site_name: 浙学润心・知途不惑
site_url: https://shadow17238.github.io/ZJUERG/
repo_url: https://git.zju.edu.cn/3240101876/zjuerg.git
repo_name: ZJUERG

theme:
  name: material
  language: zh
  font:
    text: Noto Serif SC
    code: Noto Sans Mono CJK SC
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - 主页: index.md
  - 学院导览: college-guide.md
  - 课程导航:
    - course-navigation.md
    - 2024级:
      - course-navigation/2024/index.md
      - 环境科学: course-navigation/2024/huanke.md
      - 环境工程: course-navigation/2024/huangong.md
    - 2025级:
      - course-navigation/2025/index.md
      - 环境科学: course-navigation/2025/huanke.md
      - 环境工程: course-navigation/2025/huangong.md
  - 通识课程: general-education/index.md
  - 专业基础课: professional-basic/index.md
  - 专业必修课: professional-required/index.md
  - 专业方向/选修课程: professional-elective/index.md
  - 实践教学: practical-teaching/index.md
  - 升学之路: further-education/index.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false

validation:
  omitted_files: ignore